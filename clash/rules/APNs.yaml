# Apple Push Notification service (APNs)
#
# Sources / references:
# - Apple Support: APNs network requirements
# - QuixoticHeart/rule-set: loon/apns.list (reviewed and narrowed)
# - blackmatrix7/ios_rule_script (reference only)
#
# Policy:
# - Keep only APNs-specific host/network rules.
# - Avoid broad CDN/CNAME matches such as *.akadns.net or apple.com.edgekey.net.

payload:
  # Apple official APNs host
  - DOMAIN-SUFFIX,push.apple.com

  # Apple-published APNs IPv4 ranges
  - IP-CIDR,17.188.128.0/18,no-resolve
  - IP-CIDR,17.188.20.0/23,no-resolve
  - IP-CIDR,17.249.0.0/16,no-resolve
  - IP-CIDR,17.252.0.0/16,no-resolve
  - IP-CIDR,17.57.144.0/22,no-resolve

  # Apple-published APNs IPv6 ranges
  - IP-CIDR6,2403:300:a42::/48,no-resolve
  - IP-CIDR6,2403:300:a51::/48,no-resolve
  - IP-CIDR6,2620:149:a44::/48,no-resolve
  - IP-CIDR6,2a01:b740:a42::/48,no-resolve
